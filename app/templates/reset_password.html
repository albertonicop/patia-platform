<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña | PATIA</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="auth-body">
<main class="auth-page">
    <section class="auth-card">
        <div class="auth-brand">
            <img src="{{ url_for('static', filename='img/logo-patia.png') }}" alt="PATIA">
            <p>Control inteligente para empresas modernas</p>
        </div>
        {% if expired %}
        <div class="auth-header">
            <h1>Enlace expirado</h1>
            <p>Este enlace ya no es válido o expiró. Solicita uno nuevo.</p>
        </div>
        <a href="/forgot-password" style="display:block;text-align:center;margin-top:24px;padding:14px;background:linear-gradient(135deg,#7c5cff,#29d3a8);color:white;border:none;border-radius:14px;font-weight:800;cursor:pointer;text-decoration:none;">Solicitar nuevo enlace</a>
        {% else %}
        <div class="auth-header">
            <h1>Nueva contraseña</h1>
            <p>Escribe tu nueva contraseña.</p>
        </div>
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label>Nueva contraseña</label>
                <input type="password" name="password" placeholder="••••••••" required minlength="8">
            </div>
            <button type="submit" style="width:100%;padding:14px;background:linear-gradient(135deg,#7c5cff,#29d3a8);color:white;border:none;border-radius:14px;font-weight:800;cursor:pointer;font-size:16px;">Guardar contraseña</button>
        </form>
        {% endif %}
        <p style="margin-top:16px;text-align:center;color:#9aa8c7;">
            <a href="/login" style="color:#29d3a8;">Volver al login</a>
        </p>
    </section>
</main>
</body>
</html>
