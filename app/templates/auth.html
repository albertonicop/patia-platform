<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
</head>
<body style="background:#0b1020;color:white;font-family:Arial;padding:40px;">
  <h1>{{ title }}</h1>

  <form method="POST">
    {% if mode == "register" %}
      <p>Empresa</p>
      <input name="company_name" required>
    {% endif %}

    <p>Correo</p>
    <input type="email" name="email" required>

    <p>Contraseña</p>
    <input type="password" name="password" required>

    <br><br>
    <button type="submit">{{ button }}</button>
  </form>

  {% if mode == "login" %}
    <p><a href="{{ url_for('main.register') }}">Crear cuenta</a></p>
  {% else %}
    <p><a href="{{ url_for('main.login') }}">Iniciar sesión</a></p>
  {% endif %}
</body>
</html>
